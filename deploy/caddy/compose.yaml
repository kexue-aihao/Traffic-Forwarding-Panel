name: traffic-forwarding-caddy
services:
  panel:
    build:
      context: ../..
    image: traffic-forwarding-panel:caddy-local
    restart: unless-stopped
    environment:
      TFP_CONFIG_FILE: /etc/traffic-forwarding-panel/config.yaml
      # Clear the image's old defaults so YAML owns listen/database selection.
      TFP_ADDR: ""
      TFP_DSN: ""
      TZ: Asia/Shanghai
    volumes:
      - panel_data:/data
      - ./config.yaml:/etc/traffic-forwarding-panel/config.yaml:ro
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  caddy:
    image: caddy:2.11.4-alpine
    restart: unless-stopped
    depends_on:
      panel:
        condition: service_healthy
    environment:
      PANEL_DOMAIN: ${PANEL_DOMAIN:?Set PANEL_DOMAIN in .env to your public domain}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.docker:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  panel_data:
  caddy_data:
  caddy_config:
