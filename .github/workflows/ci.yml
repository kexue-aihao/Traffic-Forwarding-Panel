name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tfp
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: tfp_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 12
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test-only
          MYSQL_DATABASE: tfp_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h 127.0.0.1 -ptest-only" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l cmd internal)"
      - run: bash -n install.sh
      - run: bash -n internal/agentdist/agent-install.sh
      - run: shellcheck install.sh internal/agentdist/agent-install.sh
      - run: go generate ./internal/openapi
      - run: git diff --exit-code -- internal/openapi/openapi.json
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./internal/commerce ./internal/platform ./internal/storage ./internal/app ./internal/integration -count=1
        env:
          TFP_TEST_DRIVER: postgres
          TFP_TEST_DSN: postgres://tfp:test-only@localhost:5432/tfp_test?sslmode=disable
      - run: go test ./internal/commerce ./internal/platform ./internal/storage ./internal/app ./internal/integration -count=1
        env:
          TFP_TEST_DRIVER: mysql
          TFP_TEST_DSN: root:test-only@tcp(localhost:3306)/tfp_test?parseTime=true
      - run: go build ./cmd/panel ./cmd/agent
      - run: GOOS=linux GOARCH=arm64 go build ./cmd/panel ./cmd/agent
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run typecheck
        working-directory: web
      - run: npm run build
        working-directory: web
      - run: git diff --exit-code -- internal/webui/assets
      - run: test -z "$(git status --porcelain -- internal/webui/assets)"
      - run: '! grep -r -E "v-html|new Function|eval\\(" web/src internal/webui/assets/app.js'
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm test
        working-directory: web
      - run: npm run test:live
        working-directory: web
      - name: Install Caddy for HTTPS integration
        env:
          CADDY_VERSION: 2.11.4
        run: |
          cd "$RUNNER_TEMP"
          archive="caddy_${CADDY_VERSION}_linux_amd64.tar.gz"
          checksums="caddy_${CADDY_VERSION}_checksums.txt"
          base="https://github.com/caddyserver/caddy/releases/download/v${CADDY_VERSION}"
          curl -fsSLO "$base/$archive"
          curl -fsSLO "$base/$checksums"
          sha512sum --check --ignore-missing "$checksums"
          tar -xzf "$archive" caddy
          echo "TFP_TEST_CADDY=$RUNNER_TEMP/caddy" >> "$GITHUB_ENV"
      - run: node scripts/test_caddy.mjs
